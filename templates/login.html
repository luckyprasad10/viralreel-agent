<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViralReel AI - Secure Dashboard Authentication</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main Neumorphic Stylesheet -->
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 40px 36px;
            border-radius: var(--radius-lg);
            background: var(--neu-surface-gradient);
            box-shadow: var(--neu-flat);
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .auth-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
        }

        .auth-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo {
            width: 58px;
            height: 58px;
            border-radius: var(--radius-md);
            background: var(--neu-surface-active);
            box-shadow: var(--neu-pressed-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: var(--accent-cyan);
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .auth-brand h1 {
            font-family: var(--font-heading);
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 40%, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .auth-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: var(--radius-full);
            background: var(--neu-surface-active);
            box-shadow: var(--neu-pressed-sm);
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-purple);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-label {
            font-family: var(--font-heading);
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            font-size: 15px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .auth-input {
            width: 100%;
            background: var(--neu-surface-active);
            box-shadow: var(--neu-pressed-sm);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: var(--radius-md);
            padding: 14px 16px 14px 44px;
            color: #ffffff;
            font-family: var(--font-body);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }

        .auth-input:focus {
            border-color: rgba(139, 92, 246, 0.5);
            box-shadow: var(--neu-pressed), 0 0 12px var(--accent-purple-glow);
        }

        .auth-btn {
            width: 100%;
            padding: 15px;
            border-radius: var(--radius-md);
            font-family: var(--font-heading);
            font-size: 14.5px;
            font-weight: 800;
            cursor: pointer;
            border: none;
            outline: none;
            background: linear-gradient(135deg, #7c3aed, #581c87);
            color: #ffffff;
            border: 1px solid rgba(139, 92, 246, 0.4);
            box-shadow: var(--neu-flat-sm), 0 4px 16px rgba(139, 92, 246, 0.3);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 6px;
        }

        .auth-btn:hover {
            background: linear-gradient(135deg, #8b5cf6, #6b21a8);
            box-shadow: var(--neu-flat), 0 6px 22px var(--accent-purple-glow);
            transform: translateY(-2px);
        }

        .auth-btn:active {
            transform: translateY(1px);
            box-shadow: var(--neu-pressed-sm);
        }

        .error-banner {
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            font-size: 12.5px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: shake 0.3s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
            40%, 60% { transform: translate3d(3px, 0, 0); }
        }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 11.5px;
            color: var(--text-muted);
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="auth-logo">⚡</div>
                <h1>ViralReel AI</h1>
                <div class="auth-badge">
                    <span>🛡️</span> Protected Autonomous Console
                </div>
            </div>

            {% if error %}
            <div class="error-banner">
                <span>❌</span>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form class="auth-form" method="POST" action="/login">
                <div class="input-group">
                    <label class="input-label" for="username">
                        <span>Admin Handle or Username</span>
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="username" name="username" class="auth-input" placeholder="admin or lucky" value="{{ username or '' }}" required autofocus autocomplete="username">
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label" for="password">
                        <span>Security Password</span>
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" name="password" class="auth-input" placeholder="••••••••••••" required autocomplete="current-password">
                    </div>
                </div>

                <div style="display: flex; align-items: center; gap: 10px; margin-top: 4px;">
                    <label class="toggle-switch" style="width: 38px; height: 22px;">
                        <input type="checkbox" name="remember" checked>
                        <span class="slider" style="border-radius: 20px;"></span>
                    </label>
                    <span style="font-size: 12px; color: var(--text-secondary); font-weight: 600;">Remember this browser for 30 days</span>
                </div>

                <button type="submit" class="auth-btn">
                    <span>🔓</span> Unlock AI Director
                </button>
            </form>

            <div class="auth-footer">
                Secured by Cryptographic HMAC Authentication.<br>
                Only authorized administrators can access this portal.
            </div>
        </div>
    </div>
</body>
</html>
